<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题练云 v5 - 登录注册</title>
  <style>
    :root {
      --ink: #13223a;
      --muted: #60708a;
      --blue: #2563eb;
      --green: #159a72;
      --orange: #ed6a2c;
      --line: rgba(19, 34, 58, 0.14);
      --panel: rgba(255, 255, 255, 0.9);
      --shadow: 0 28px 80px rgba(18, 46, 105, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(238, 245, 255, 0.76)),
        url("assets/backgrounds/main-page.jpg");
      background-size: cover;
      background-position: center;
    }

    .auth-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      gap: 34px;
      align-items: center;
      width: min(1120px, calc(100vw - 36px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 0;
    }

    .brand-panel {
      display: grid;
      gap: 22px;
    }

    .brand-mark {
      display: flex;
      gap: 14px;
      align-items: center;
      font-weight: 900;
    }

    .brand-badge {
      display: grid;
      place-items: center;
      width: 60px;
      height: 60px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.85), var(--blue));
      border: 3px solid rgba(255, 255, 255, 0.86);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(37, 99, 235, 0.24);
      font-size: 26px;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(38px, 6vw, 76px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand-copy {
      max-width: 640px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      font-weight: 700;
    }

    .feature-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .feature-strip span {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      font-weight: 900;
      color: var(--muted);
    }

    .hero-art {
      width: min(280px, 55vw);
      filter: drop-shadow(0 24px 34px rgba(18, 46, 105, 0.22));
    }

    .auth-card {
      display: grid;
      gap: 18px;
      padding: 28px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .auth-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .auth-head h2 {
      margin: 0;
      font-size: 28px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 5px;
      background: rgba(224, 236, 255, 0.74);
      border-radius: 16px;
    }

    .mode-switch button {
      border: 0;
      padding: 10px 14px;
      color: var(--muted);
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
    }

    .mode-switch button.active {
      color: #fff;
      background: var(--blue);
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--ink);
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .code-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .code-row .btn {
      min-width: 128px;
      white-space: nowrap;
    }

    .captcha-row {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .captcha-row img {
      width: 140px;
      height: 52px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #eff6ff;
    }

    .captcha-row .btn {
      min-width: 92px;
      white-space: nowrap;
    }

    .btn {
      min-height: 48px;
      padding: 12px 18px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      font-weight: 950;
      text-decoration: none;
      text-align: center;
    }

    .btn.primary {
      flex: 1 1 180px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #3157f3);
      border-color: transparent;
    }

    .btn.success {
      flex: 1 1 160px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), #27c49d);
      border-color: transparent;
    }

    .btn.ghost {
      flex: 1 1 130px;
    }

    .status {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.6;
    }

    .status.error {
      color: #b91c1c;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .auth-shell {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .brand-panel {
        padding-top: 12px;
      }

      .hero-art {
        display: none;
      }

      .auth-card {
        padding: 22px;
        border-radius: 22px;
      }

      .captcha-row {
        grid-template-columns: 1fr;
      }

      .captcha-row img,
      .captcha-row .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="brand-mark">
        <span class="brand-badge" aria-label="随机头像">
          <img id="brandAvatar" alt="题练云头像">
        </span>
        <div>
          <strong>题练云 v5</strong>
          <div>Question Training Cloud</div>
        </div>
      </div>
      <h1>登录后进入你的刷题工作台</h1>
      <p class="brand-copy">统一管理题库、错题、收藏、AI 解析和学习分析。账号信息会写入本地 v5 平台，进入后即可继续刷题。</p>
      <div class="feature-strip">
        <span>SQLite 数据库</span>
        <span>AI 识别导入</span>
        <span>键盘刷题</span>
        <span>错题组卷</span>
      </div>
      <img class="hero-art" src="assets/characters/hero-character.png" alt="">
    </section>

    <section class="auth-card">
      <div class="auth-head">
        <h2 id="authTitle">登录</h2>
        <div class="mode-switch" aria-label="切换登录注册">
          <button id="loginMode" class="active" type="button">登录</button>
          <button id="registerMode" type="button">注册</button>
        </div>
      </div>

      <label>用户名<input id="username" autocomplete="username" placeholder="请输入用户名"></label>
      <label id="nicknameField" class="hidden">昵称<input id="nickname" placeholder="显示在页面上的名字"></label>
      <label id="emailField" class="hidden">QQ 邮箱<input id="email" type="email" autocomplete="email" placeholder="例如 123456@qq.com"></label>
      <label id="captchaField" class="hidden">图形识别码
        <div class="captcha-row">
          <img id="captchaImage" alt="图形识别码">
          <input id="captchaCode" autocomplete="off" maxlength="6" placeholder="输入图片字符">
          <button id="refreshCaptcha" class="btn ghost" type="button">换一张</button>
        </div>
      </label>
      <label id="emailCodeField" class="hidden">邮箱验证码
        <div class="code-row">
          <input id="emailCode" inputmode="numeric" placeholder="6 位验证码">
          <button id="sendEmailCode" class="btn ghost" type="button">发送验证码</button>
        </div>
      </label>
      <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位"></label>

      <div class="button-row">
        <button id="submitAuth" class="btn primary" type="button">登录</button>
        <a id="enterApp" class="btn success" href="v5/index.html">进入 v5</a>
        <button id="logoutAuth" class="btn ghost hidden" type="button">退出登录</button>
      </div>
      <p id="status" class="status">已有账号可直接登录，新用户切换到注册。</p>
    </section>
  </main>

  <script>
    const state = {
      mode: 'login',
      token: localStorage.getItem('exam_v5_token') || '',
      user: JSON.parse(localStorage.getItem('exam_v5_user') || 'null'),
      captchaId: ''
    };
    const landingAvatars = [
      'assets/head%20portrait/1.jpg',
      'assets/head%20portrait/2.jpg',
      'assets/head%20portrait/3.jpg',
      'assets/head%20portrait/4.jpg',
      'assets/head%20portrait/5.jpg',
      'assets/head%20portrait/6.jpg',
      'assets/head%20portrait/7.jpg'
    ];

    const $ = (selector) => document.querySelector(selector);

    function hydrateLandingAvatar() {
      const storageKey = 'exam_v5_landing_avatar';
      const avatar = $('#brandAvatar');
      if (!avatar) return;
      let selected = '';
      try {
        selected = sessionStorage.getItem(storageKey) || '';
      } catch (error) {
        selected = '';
      }
      if (!landingAvatars.includes(selected)) {
        selected = landingAvatars[Math.floor(Math.random() * landingAvatars.length)];
        try {
          sessionStorage.setItem(storageKey, selected);
        } catch (error) {
          // 存储不可用时仍显示本次随机头像，不影响登录。
        }
      }
      avatar.src = selected;
      avatar.onerror = () => {
        avatar.remove();
        $('.brand-badge').textContent = '题';
      };
    }

    function setMode(mode) {
      state.mode = mode;
      $('#loginMode').classList.toggle('active', mode === 'login');
      $('#registerMode').classList.toggle('active', mode === 'register');
      $('#nicknameField').classList.toggle('hidden', mode !== 'register');
      $('#emailField').classList.toggle('hidden', mode !== 'register');
      $('#captchaField').classList.toggle('hidden', mode !== 'register');
      $('#emailCodeField').classList.toggle('hidden', mode !== 'register');
      $('#authTitle').textContent = mode === 'login' ? '登录' : '注册';
      $('#submitAuth').textContent = mode === 'login' ? '登录' : '注册并进入';
      setStatus(mode === 'login' ? '已有账号可直接登录，新用户切换到注册。' : '注册需要先识别图形码，再发送 QQ 邮箱验证码。');
      if (mode === 'register') refreshCaptcha();
    }

    function setStatus(message, isError = false) {
      $('#status').textContent = message;
      $('#status').classList.toggle('error', isError);
    }

    function appTarget() {
      return `v5/index.html${location.hash || ''}`;
    }

    function syncSessionUi() {
      $('#enterApp').href = appTarget();
      $('#logoutAuth').classList.toggle('hidden', !state.token);
      if (state.token && state.user) {
        setStatus(`当前已登录：${state.user.nickname || state.user.username}，可以直接进入 v5。`);
      }
    }

    async function requestJson(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || '请求失败');
      return data;
    }

    async function getJson(path) {
      const response = await fetch(path);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || data.message || '请求失败');
      return data;
    }

    async function refreshCaptcha() {
      try {
        const result = await getJson('/api/captcha');
        state.captchaId = result.id || '';
        $('#captchaImage').src = result.captcha_image || '';
        $('#captchaCode').value = '';
      } catch (error) {
        state.captchaId = '';
        setStatus(error.message, true);
      }
    }

    async function sendEmailCode() {
      const email = $('#email').value.trim();
      const captchaCode = $('#captchaCode').value.trim();
      if (!/^[A-Za-z0-9._%+\-]{3,64}@qq\.com$/i.test(email)) {
        setStatus('请填写 QQ 邮箱，例如 123456@qq.com。', true);
        return;
      }
      if (!state.captchaId || !captchaCode) {
        setStatus('请先识别图形验证码，再发送邮箱验证码。', true);
        return;
      }
      try {
        $('#sendEmailCode').disabled = true;
        setStatus('正在发送 QQ 邮箱验证码...');
        const result = await requestJson('/api/email/send-code', {
          email,
          captchaId: state.captchaId,
          captchaCode
        });
        if (result.dev_code) $('#emailCode').value = result.dev_code;
        setStatus(result.dev_code ? `本地开发验证码：${result.dev_code}` : '验证码已发送，请查看 QQ 邮箱。');
        await refreshCaptcha();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        $('#sendEmailCode').disabled = false;
      }
    }

    async function submitAuth() {
      const username = $('#username').value.trim();
      const password = $('#password').value;
      const nickname = $('#nickname').value.trim() || username;
      if (!username || !password) {
        setStatus('请先填写用户名和密码。', true);
        return;
      }
      try {
        setStatus(state.mode === 'login' ? '正在登录...' : '正在注册...');
        if (state.mode === 'register') {
          await requestJson('/api/register', {
            username,
            password,
            nickname,
            email: $('#email').value.trim(),
            emailCode: $('#emailCode').value.trim()
          });
        }
        const login = await requestJson('/api/login', { username, password });
        state.token = login.token;
        state.user = login.user;
        localStorage.setItem('exam_v5_token', login.token);
        localStorage.setItem('exam_v5_user', JSON.stringify(login.user));
        setStatus('登录成功，正在进入 v5...');
        location.href = appTarget();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function logoutAuth() {
      state.token = '';
      state.user = null;
      localStorage.removeItem('exam_v5_token');
      localStorage.removeItem('exam_v5_user');
      syncSessionUi();
      setStatus('已退出登录，可以重新登录或注册。');
    }

    $('#loginMode').addEventListener('click', () => setMode('login'));
    $('#registerMode').addEventListener('click', () => setMode('register'));
    $('#submitAuth').addEventListener('click', submitAuth);
    $('#sendEmailCode').addEventListener('click', sendEmailCode);
    $('#refreshCaptcha').addEventListener('click', refreshCaptcha);
    $('#logoutAuth').addEventListener('click', logoutAuth);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') submitAuth();
    });
    hydrateLandingAvatar();
    syncSessionUi();
  </script>
</body>
</html>
